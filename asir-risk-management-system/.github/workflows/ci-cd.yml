name: Asir ERMS CI/CD

on:
  push:
    branches: [main, master]
    paths:
      - 'asir-risk-management-system/**'
  pull_request:
    paths:
      - 'asir-risk-management-system/**'

defaults:
  run:
    working-directory: asir-risk-management-system

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erms_user
          POSTGRES_PASSWORD: erms_password
          POSTGRES_DB: asir_erms_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erms_user -d asir_erms_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: asir-risk-management-system/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: asir-risk-management-system/backend
        run: npm ci

      - name: Load schema + seed data
        env:
          PGPASSWORD: erms_password
        run: |
          psql -h localhost -U erms_user -d asir_erms_ci -f db/schema.sql
          psql -h localhost -U erms_user -d asir_erms_ci -f db/seed.sql

      - name: Run backend tests
        working-directory: asir-risk-management-system/backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: erms_user
          DB_PASSWORD: erms_password
          DB_NAME: asir_erms_ci
          JWT_ACCESS_SECRET: ci_test_access_secret
          JWT_REFRESH_SECRET: ci_test_refresh_secret
        run: npm test --if-present

      - name: Syntax-check all backend sources
        working-directory: asir-risk-management-system/backend
        run: find src -name "*.js" -exec node --check {} \;

  build-images:
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t asir-erms-backend:ci ./asir-risk-management-system/backend

      - name: Build frontend image
        run: docker build -t asir-erms-frontend:ci ./asir-risk-management-system/frontend
